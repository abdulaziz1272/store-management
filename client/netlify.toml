# Netlify settings.
#
# The first rule makes Netlify pass every /api request to the Render server.
# Because the browser only ever talks to the Netlify address, login cookies
# work without any CORS setup.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://store-management-api-i788.onrender.com/api/:splat"
  status = 200
  force = true

# Single page app: every other address opens index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
